# ============================================
# Serenity BDD Configuration
# QA Training App - Group 50
# ============================================
# 
# Best Practices Applied:
# - Centralized configuration
# - Environment-specific settings
# - Proper timeout handling
# - Comprehensive reporting

# ==================== WebDriver Settings ====================
webdriver.driver=chrome
webdriver.autodownload=true

# Chrome-specific options (uncomment for headless)
# chrome.switches=--headless,--disable-gpu,--window-size=1920,1080
# webdriver.chrome.silentOutput=true

# ==================== Application URLs ====================
webdriver.base.url=http://localhost:8080
api.base.url=http://localhost:8080

# ==================== Timeout Configuration ====================

# Implicit wait (seconds) - applies to all element searches
webdriver.timeouts.implicitlywait=5000

# Page load timeout (milliseconds)
webdriver.wait.for.timeout=30000

# Element wait timeout (milliseconds)
serenity.timeout=10000

# ==================== Screenshot Settings ====================
# Options: FOR_FAILURES, FOR_EACH_ACTION, BEFORE_AND_AFTER_EACH_STEP, DISABLED
serenity.take.screenshots=FOR_FAILURES

# Resize screenshots to save space
serenity.resized.image.width=1280

# ==================== Report Settings ====================
serenity.project.name=QA Training App - Group 50
serenity.test.root=com.OnTerminal

# Report format
serenity.report.show.manual.tests=false
serenity.report.show.releases=false

# Tags to display in report
serenity.report.tagtypes=capability,feature,story,component

# ==================== Test Execution Settings ====================

# Restart browser between tests (for clean state)
serenity.restart.browser.for.each=scenario

# Use unique browser for each test (parallel execution support)
serenity.use.unique.browser=false

# Batch test execution
serenity.batch.strategy=DIVIDE_EQUALLY

# ==================== Logging Settings ====================

# Verbose logging for debugging
serenity.verbose.logging=false
serenity.logging=VERBOSE

# ==================== Feature Toggles ====================

# Dry run mode (validates step definitions without executing)
serenity.dry.run=false

# Skip tests without step definitions
serenity.test.statistics.dir=false

# ==================== Environment-Specific Settings ====================
# Override via command line: -Denvironment=staging

# Default environment
environment=local

# Local environment settings
environments.local.webdriver.base.url=http://localhost:8080
environments.local.api.base.url=http://localhost:8080